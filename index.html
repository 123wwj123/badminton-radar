<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全国羽毛球赛事雷达 | 业余及公开赛查询</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <!-- 顶部导航 -->
  <header class="bg-emerald-600 text-white shadow-sm sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <div>
        <h1 class="text-xl font-bold tracking-tight flex items-center gap-2">
          <span>🏸</span> 各地羽毛球赛事查询
        </h1>
        <p class="text-emerald-100 text-xs mt-0.5">实时聚合各地公开赛、俱乐部积分赛与团体赛信息</p>
      </div>
      <div class="text-xs bg-emerald-700/60 px-3 py-1.5 rounded-full self-start sm:self-auto">
        数据持续同步中
      </div>
    </div>
  </header>

  <!-- 筛选控制区 -->
  <main class="max-w-5xl mx-auto px-4 py-6">
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200/80 mb-6 space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <!-- 城市选择 -->
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">举办城市</label>
          <select id="cityFilter" class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="全部">全部城市</option>
            <option value="深圳市">深圳市</option>
            <option value="杭州市">杭州市</option>
            <option value="广州市">广州市</option>
            <option value="上海市">上海市</option>
            <option value="北京市">北京市</option>
            <option value="成都市">成都市</option>
          </select>
        </div>

        <!-- 报名状态 -->
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">报名状态</label>
          <select id="statusFilter" class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="all">全部状态</option>
            <option value="open" selected>报名中</option>
            <option value="upcoming">即将开始</option>
            <option value="full">名额已满</option>
          </select>
        </div>

        <!-- 关键词搜索 -->
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">关键词检索</label>
          <div class="flex gap-2">
            <input id="searchInput" type="text" placeholder="赛事名 / 球馆 / 省份..." 
              class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            <button onclick="fetchTournaments()" 
              class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium shrink-0 transition">
              查询
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 赛事列表容器 -->
    <div id="loading" class="text-center py-12 text-slate-400 hidden">正在加载赛事数据...</div>
    <div id="emptyState" class="text-center py-12 bg-white rounded-xl border border-slate-200 hidden">
      <p class="text-slate-500 text-sm">暂无符合筛选条件的羽毛球赛事</p>
    </div>
    <div id="eventList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>

  <script>
    const statusMap = {
      open: { text: '报名中', cls: 'bg-emerald-100 text-emerald-700' },
      upcoming: { text: '即将开始', cls: 'bg-amber-100 text-amber-700' },
      full: { text: '名额已满', cls: 'bg-slate-100 text-slate-600' }
    };

    async function fetchTournaments() {
      const city = document.getElementById('cityFilter').value;
      const status = document.getElementById('statusFilter').value;
      const q = document.getElementById('searchInput').value.trim();

      const listEl = document.getElementById('eventList');
      const loadingEl = document.getElementById('loading');
      const emptyEl = document.getElementById('emptyState');

      listEl.innerHTML = '';
      emptyEl.classList.add('hidden');
      loadingEl.classList.remove('hidden');

      try {
        const params = new URLSearchParams({ city, status, q });
        const res = await fetch(`/api/tournaments?${params.toString()}`);
        const json = await res.json();
        loadingEl.classList.add('hidden');

        if (!json.success || !json.data || json.data.length === 0) {
          emptyEl.classList.remove('hidden');
          return;
        }

        json.data.forEach(item => {
          let categories = [];
          try { categories = JSON.parse(item.categories || '[]'); } catch (e) {}
          const st = statusMap[item.status] || statusMap.open;

          const card = document.createElement('div');
          card.className = 'bg-white rounded-xl p-5 shadow-sm border border-slate-200/80 hover:border-emerald-300 transition flex flex-col justify-between';
          card.innerHTML = `
            <div>
              <div class="flex items-start justify-between gap-2 mb-2">
                <span class="text-xs font-medium px-2.5 py-0.5 rounded-full ${st.cls}">${st.text}</span>
                <span class="text-xs text-slate-400">来源：${item.source_platform}</span>
              </div>
              <h2 class="text-base font-bold text-slate-900 leading-snug mb-3">${item.title}</h2>
              <div class="space-y-1.5 text-xs text-slate-600 mb-4">
                <p>📍 <span class="font-medium">${item.city}${item.district ? ' · ' + item.district : ''}</span>（${item.venue || '待定场馆'}）</p>
                <p>📅 比赛时间：<span class="font-medium text-slate-800">${item.match_date}</span>（截止：${item.signup_deadline || '报满即止'}）</p>
                <p>🏆 水平限制：${item.skill_level || '不限'} ｜ 💰 费用：${item.entry_fee || '见详情'}</p>
              </div>
              <div class="flex flex-wrap gap-1.5 mb-4">
                ${categories.map(c => `<span class="text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded">${c}</span>`).join('')}
              </div>
            </div>
            <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
              <span class="text-xs text-slate-400">更新于 ${item.updated_at?.slice(0, 10) || '近期'}</span>
              <a href="${item.signup_url || '#'}" target="_blank" rel="noopener"
                class="text-xs font-semibold text-emerald-600 hover:text-emerald-700 flex items-center gap-1">
                前往报名 / 详情 →
              </a>
            </div>
          `;
          listEl.appendChild(card);
        });
      } catch (err) {
        loadingEl.classList.add('hidden');
        emptyEl.classList.remove('hidden');
        console.error(err);
      }
    }

    document.getElementById('cityFilter').addEventListener('change', fetchTournaments);
    document.getElementById('statusFilter').addEventListener('change', fetchTournaments);
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') fetchTournaments();
    });

    // 页面加载自动查询
    fetchTournaments();
  </script>
</body>
</html>
